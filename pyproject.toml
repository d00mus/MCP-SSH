[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-ssh-gateway"
dynamic = ["version"]
description = "MCP server that gives an AI agent real SSH terminals: sessions that return the moment a command ends, scrollable output, prompt and question detection, Keenetic router CLI support."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Constantine Shklyarov", email = "d00mus@users.noreply.github.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ssh",
    "ssh-gateway",
    "ai-agents",
    "ai-devops",
    "multi-server",
    "keenetic",
    "router",
    "paramiko",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["paramiko>=3.0.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5.1", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/d00mus/MCP-SSH"
Repository = "https://github.com/d00mus/MCP-SSH"
Issues = "https://github.com/d00mus/MCP-SSH/issues"
Changelog = "https://github.com/d00mus/MCP-SSH/blob/master/CHANGELOG.md"

[project.scripts]
mcp-ssh-gateway = "mcp_ssh_gateway.main:main"

[tool.setuptools]
packages = ["mcp_ssh_gateway"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "mcp_ssh_gateway.__version__" }

[tool.setuptools.package-data]
mcp_ssh_gateway = ["py.typed"]

[tool.mypy]
python_version = "3.11"
files = ["mcp_ssh_gateway"]

[[tool.mypy.overrides]]
module = "paramiko.*"
ignore_missing_imports = true  # paramiko ships neither stubs nor py.typed

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"mcp_ssh_gateway/server.py" = ["E501"]  # tool descriptions are prose

